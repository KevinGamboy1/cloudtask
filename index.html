<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudTask v1.1</title>
 
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: linear-gradient(135deg, #DAD7CD, #e5e3db); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 30px; color: #344E41; }
    .app { width: 100%; max-width: 820px; background: white; border-radius: 24px; box-shadow: 0 20px 50px rgba(52, 78, 65, 0.2); overflow: hidden; }
    .header { background: linear-gradient(135deg, #588157, #3A5A40); color: white; padding: 35px; text-align: center; }
    .developer-name { font-size: 16px; font-weight: 600; margin-bottom: 15px; color: #DAD7CD; text-transform: uppercase; letter-spacing: 1px; }
    .header h1 { font-size: 34px; margin-bottom: 8px; letter-spacing: -0.5px; }
    .header p { opacity: 0.9; font-size: 15px; }
    .version { display: inline-block; margin-top: 14px; padding: 6px 14px; border-radius: 20px; background: rgba(218, 215, 205, 0.2); font-size: 13px; font-weight: 600; letter-spacing: 0.5px; }
    .content { padding: 32px; }
    .input-group { display: grid; grid-template-columns: 1fr 160px 120px; gap: 12px; margin-bottom: 28px; }
    input, select { padding: 16px; border: 2px solid #A3B18A; border-radius: 12px; font-size: 15px; transition: border-color 0.3s ease; color: #344E41; }
    input:focus, select:focus { outline: none; border-color: #588157; }
    #addTaskBtn { border: none; background: #588157; color: white; border-radius: 12px; font-weight: bold; cursor: pointer; transition: transform 0.1s ease, background-color 0.2s ease; }
    #addTaskBtn:hover { background: #3A5A40; }
    #addTaskBtn:active { transform: scale(0.98); }
    .toolbar { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; }
    .filter-btn { border: none; background: #DAD7CD; color: #344E41; padding: 10px 18px; border-radius: 20px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .filter-btn.active { background: #3A5A40; color: white; }
    .clear-btn { border: none; background: #fee2e2; color: #ef4444; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .task-list { list-style: none; }
    .task { display: flex; justify-content: space-between; align-items: center; background: #f9fbf9; border: 1px solid #A3B18A; border-radius: 14px; padding: 16px 20px; margin-bottom: 12px; }
    .task-left { display: flex; align-items: center; gap: 14px; }
    .task-info { display: flex; flex-direction: column; gap: 5px; }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: #588157; }
    .task.completed .task-text { text-decoration: line-through; color: #A3B18A; }
    .priority { width: fit-content; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .priority-baja { background: #dcfce7; color: #166534; }
    .priority-media { background: #fef3c7; color: #92400e; }
    .priority-alta { background: #fee2e2; color: #b91c1c; }
    .delete-btn { border: none; background: #fee2e2; color: #ef4444; border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer; }
    .summary { margin-top: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .summary-card { background: #DAD7CD; color: #344E41; padding: 16px; border-radius: 12px; text-align: center; font-weight: 600; }
    .summary-card strong { display: block; font-size: 26px; margin-top: 5px; font-weight: 700; }
    .empty { text-align: center; color: #A3B18A; padding: 30px; font-style: italic; }
    footer { border-top: 1px solid #DAD7CD; text-align: center; padding: 20px; color: #588157; font-size: 13px; background: #fdfdfd; }
    @media(max-width:700px) { .input-group, .summary { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="developer-name">Kevin Paul Gamboy Remache</div>
    <h1>☁ CloudTask</h1>
    <p>Gestor de tareas interactivo</p>
    <span class="version">Versión 1.1</span>
  </div>
  <div class="content">
    <div class="input-group">
      <input id="taskInput" type="text" placeholder="Escribe una nueva tarea...">
      <select id="prioritySelect">
        <option value="baja">Prioridad baja</option>
        <option value="media" selected>Prioridad media</option>
        <option value="alta">Prioridad alta</option>
      </select>
      <button id="addTaskBtn">Agregar</button>
    </div>
    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="pending">Pendientes</button>
        <button class="filter-btn" data-filter="completed">Completadas</button>
      </div>
      <button id="clearCompletedBtn" class="clear-btn">Eliminar completadas</button>
    </div>
    <ul id="taskList" class="task-list"></ul>
    <div class="summary">
      <div class="summary-card">Total de tareas <strong id="totalCount">0</strong></div>
      <div class="summary-card">Tareas pendientes <strong id="pendingCount">0</strong></div>
    </div>
  </div>
  <footer>
    CloudTask v1.1 · Desarrollado por: Kevin Paul Gamboy Remache
  </footer>
</div>
<script>
  const taskInput = document.getElementById("taskInput");
  const prioritySelect = document.getElementById("prioritySelect");
  const addTaskBtn = document.getElementById("addTaskBtn");
  const taskList = document.getElementById("taskList");
  const pendingCount = document.getElementById("pendingCount");
  const totalCount = document.getElementById("totalCount");
  const filterButtons = document.querySelectorAll(".filter-btn");
  const clearCompletedBtn = document.getElementById("clearCompletedBtn");
  let currentFilter = "all";
  let tasks = JSON.parse(localStorage.getItem("cloudTaskTasks"));
  if (!tasks) {
    tasks = [
      { id: 1, text: "Subir proyecto a GitHub", completed: false, priority: "alta" },
      { id: 2, text: "Desplegar aplicación en Vercel", completed: false, priority: "media" },
      { id: 3, text: "Probar aplicación desde el teléfono", completed: true, priority: "baja" }
    ];
  }
  function saveTasks() { localStorage.setItem("cloudTaskTasks", JSON.stringify(tasks)); }
  function renderTasks() {
    taskList.innerHTML = "";
    const filteredTasks = tasks.filter(task => {
      if (currentFilter === "pending") return !task.completed;
      if (currentFilter === "completed") return task.completed;
      return true;
    });
    if (filteredTasks.length === 0) {
      taskList.innerHTML = '<li class="empty">No hay tareas para mostrar</li>';
    }
    filteredTasks.forEach(task => {
      const priorityText = { baja: "Baja", media: "Media", alta: "Alta" };
      const li = document.createElement("li");
      li.className = "task";
      if (task.completed) li.classList.add("completed");
      li.innerHTML = `
        <div class="task-left">
          <input type="checkbox" ${task.completed ? "checked" : ""} onchange="toggleTask(${task.id})">
          <div class="task-info">
            <span class="task-text">${task.text}</span>
            <span class="priority priority-${task.priority}">Prioridad ${priorityText[task.priority]}</span>
          </div>
        </div>
        <button class="delete-btn" onclick="deleteTask(${task.id})">Eliminar</button>
      `;
      taskList.appendChild(li);
    });
    updateCounters();
    saveTasks();
  }
  function addTask() {
    const text = taskInput.value.trim();
    if (!text) { alert("Escribe una tarea."); return; }
    tasks.push({ id: Date.now(), text, completed: false, priority: prioritySelect.value });
    taskInput.value = ""; prioritySelect.value = "media";
    renderTasks();
  }
  function toggleTask(id) {
    tasks = tasks.map(task => task.id === id ? { ...task, completed: !task.completed } : task);
    renderTasks();
  }
  function deleteTask(id) {
    tasks = tasks.filter(task => task.id !== id);
    renderTasks();
  }
  function clearCompletedTasks() {
    if (!tasks.some(task => task.completed)) { alert("No hay tareas completadas."); return; }
    if (confirm("¿Eliminar todas las tareas completadas?")) {
      tasks = tasks.filter(task => !task.completed);
      renderTasks();
    }
  }
  function updateCounters() {
    totalCount.textContent = tasks.length;
    pendingCount.textContent = tasks.filter(task => !task.completed).length;
  }
  addTaskBtn.addEventListener("click", addTask);
  taskInput.addEventListener("keypress", event => { if (event.key === "Enter") addTask(); });
  clearCompletedBtn.addEventListener("click", clearCompletedTasks);
  filterButtons.forEach(button => {
    button.addEventListener("click", function() {
      filterButtons.forEach(btn => btn.classList.remove("active"));
      this.classList.add("active");
      currentFilter = this.dataset.filter;
      renderTasks();
    });
  });
  renderTasks();
</script>
</body>
</html>
